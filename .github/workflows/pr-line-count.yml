name: PR line count

on:
  workflow_call:
    inputs:
      test-directories:
        description: Comma-separated paths relative to the repository root.
        type: string
        default: tests,test

permissions: {}

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      counts: ${{ steps.count.outputs.result }}
    steps:
      # Check out the trusted base. The PR commit is fetched only as input data.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch PR commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            fetch --no-tags origin "$PR_HEAD"
      - name: Install cloc
        run: |
          sudo apt-get update
          sudo apt-get install --yes cloc
      - name: Count changed lines
        id: count
        uses: actions/github-script@v9
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          TEST_DIRECTORIES: ${{ inputs.test-directories }}
        with:
          script: |
            const head = process.env.PR_HEAD;
            const testDirectories = process.env.TEST_DIRECTORIES.split(",")
              .map(directory => directory.trim().replace(/\/+$/, ""))
              .filter(Boolean);
            const options = { silent: true };
            const mergeBase = await exec.getExecOutput("git", ["merge-base", "HEAD", head], options);
            const base = mergeBase.stdout.trim();
            const diff = await exec.getExecOutput(
              "git", ["diff", "--numstat", "-z", "--find-renames", base, head], options
            );
            const totals = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
            if (!diff.stdout) return totals;

            const nonCode = "AsciiDoc,CSV,INI,JSON,JSON5,Markdown,reStructuredText,SVG,Text,TOML,XML,YAML";
            const cloc = await exec.getExecOutput("cloc", [
              "--git", "--diff", "--by-file", "--json", "--quiet", "--skip-uniqueness",
              "--timeout=0", "--diff-timeout=0", `--exclude-lang=${nonCode}`, base, head,
            ], options);
            const output = cloc.stdout.trim();
            const report = output && output !== "Nothing to count." ? JSON.parse(output) : {};
            const changes = ["added", "removed", "modified"].map(
              kind => new Map(Object.entries(report[kind] ?? {}))
            );

            const records = diff.stdout.split("\0");
            for (let index = 0; index < records.length - 1; index++) {
              const [, added, removed, filename] = /^(\d+|-)\t(\d+|-)\t(.*)$/s.exec(records[index]);
              // Git emits an empty filename followed by the old and new paths for renames.
              const oldPath = filename || records[++index];
              const path = filename || records[++index];
              const counts = changes.map(group => group.get(oldPath) ?? group.get(path));
              if (counts.some(count => count !== undefined)) {
                const isTest = testDirectories.some(directory => path.startsWith(directory + "/"));
                const row = isTest ? totals[1] : totals[0];
                counts.forEach((count, column) => { row[column] += count?.code ?? 0; });
              } else if (added !== "-") {
                totals[2][0] += Number(added);
                totals[2][1] += Number(removed);
              }
            }
            return totals;

  comment:
    needs: count
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Update PR line count comment
        uses: actions/github-script@v9
        env:
          COUNTS: ${{ needs.count.outputs.counts }}
        with:
          script: |
            const counts = JSON.parse(process.env.COUNTS);
            const labels = ["Source LOC", "Test LOC", "Docs, data, and assets"];
            if (
              !Array.isArray(counts) || counts.length !== labels.length ||
              !counts.every(row => Array.isArray(row) && row.length === 3 &&
                row.every(value => Number.isSafeInteger(value) && value >= 0))
            ) {
              throw new Error("Invalid PR line counts");
            }

            const marker = "<!-- ophyd-devices-pr-line-count -->";
            const body = [
              marker,
              "### PR line count",
              "",
              "| Category | Added | Removed | Modified |",
              "| --- | ---: | ---: | ---: |",
              ...counts.map(([added, removed, modified], index) =>
                `| ${labels[index]} | ${added} | ${removed} | ${index === 2 ? "—" : modified} |`
              ),
              "",
              "cloc counts source and test code. Git counts text changes in the other files.",
            ].join("\n");

            const issue = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...issue,
              per_page: 100,
            });
            const existing = comments.find(({ user, body }) =>
              user?.login === "github-actions[bot]" && body?.startsWith(marker)
            );
            if (!existing) {
              await github.rest.issues.createComment({ ...issue, body });
            } else if (existing.body !== body) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            }
